<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="quill-react-commercial">
  <defs>
    <linearGradient id="qrc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a90e2"/>
      <stop offset="1" stop-color="#6918b4"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#qrc-bg)"/>

  <!-- quill nib, drawn as a single stroke sweeping down to the baseline -->
  <path d="M92 28c2 26-8 46-26 58l-14 9-6-6 9-14C67 57 74 45 92 28Z"
        fill="#fff" fill-opacity=".95"/>
  <path d="M46 89 84 43" stroke="#fff" stroke-opacity=".55" stroke-width="4"
        stroke-linecap="round"/>

  <!-- the line being written -->
  <path d="M34 100h60" stroke="#fff" stroke-opacity=".9" stroke-width="7"
        stroke-linecap="round"/>
</svg>
